<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:900px;overflow:hidden;font-family:'DM Sans',Arial,sans-serif}body{background:#081713;color:#f3f8ef}.slide{width:1600px;height:900px;position:relative;overflow:hidden;padding:58px 78px 46px;background:radial-gradient(circle at 83% 20%,#1b5a3e88,transparent 40%),linear-gradient(140deg,#081713,#102b20)}.slide.light{color:#10251d;background:radial-gradient(circle at 80% 25%,#d8edce,transparent 42%),#f5f6ef}.slide:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent 198px,#ffffff05 199px,#ffffff05 200px);pointer-events:none}.top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:14px;font:700 22px 'Space Grotesk',Arial,sans-serif;letter-spacing:-.04em}.mark{display:grid;place-items:center;width:48px;height:48px;border:1px solid #b3f267;border-radius:14px;color:#b3f267;font-size:24px}.light .mark{background:#245c3c;color:white;border:0}.brand em{color:#b3f267;font-style:normal}.light .brand em{color:#245c3c}.top small,.footer{font:700 13px 'Space Grotesk',Arial,sans-serif;letter-spacing:.18em;color:#96b9a1}.light .top small,.light .footer{color:#547463}.content{position:relative;z-index:2;margin-top:110px;max-width:1380px}.kicker{font:700 15px 'Space Grotesk',Arial,sans-serif;letter-spacing:.2em;color:#b3f267}.light .kicker{color:#245c3c}h1{font:600 94px/1.03 'Space Grotesk',Arial,sans-serif;letter-spacing:-.075em;margin:24px 0 28px;max-width:1400px}h1 .accent{color:#b3f267}.light h1 .accent{color:#245c3c}p{font-size:29px;line-height:1.38;max-width:1050px;color:#b6cfc0}.light p{color:#5f7568}.footer{position:absolute;z-index:2;left:78px;right:78px;bottom:46px;display:flex;justify-content:space-between}.orb{position:absolute;width:550px;height:550px;border-radius:50%;border:2px solid #b3f26744;right:-85px;top:230px;box-shadow:0 0 0 80px #b3f2670b,0 0 0 160px #b3f26708}.dot{position:absolute;width:32px;height:32px;border-radius:50%;background:#b3f267;right:225px;top:480px;box-shadow:0 0 0 16px #b3f26722,0 0 55px #b3f267}.visual .content{margin-top:42px}.visual h1{font-size:65px;margin:16px 0 26px}.shot{width:1410px;height:485px;object-fit:cover;object-position:center bottom;border:1px solid #5c8563;border-radius:20px;box-shadow:0 32px 90px #0008}.visual .footer{bottom:26px}.light .shot{border-color:#c7d5c8;box-shadow:0 22px 75px #28443136}.flow{display:flex;align-items:center;gap:14px;margin-top:80px}.flow .node{background:#163b2b;border:1px solid #4c7b57;border-radius:16px;padding:28px 22px;width:245px;min-height:150px}.flow .node strong{display:block;font:700 22px 'Space Grotesk',Arial,sans-serif}.flow .node span{display:block;color:#a8c7b2;font-size:16px;margin-top:12px}.flow .arrow{color:#b3f267;font-size:34px}.chips{display:flex;gap:16px;margin-top:55px}.chips span{border:1px solid #60816a;border-radius:100px;padding:16px 23px;color:#d8eadb;font:700 18px 'Space Grotesk',Arial,sans-serif}.light .chips span{border-color:#a8cbb0;color:#245c3c}.metric{display:inline-block;font:700 68px 'Space Grotesk',Arial,sans-serif;color:#b3f267;margin:28px 0 0}.metric small{display:block;font:500 17px 'DM Sans',Arial,sans-serif;color:#adc7b4;margin-top:8px}.url{font:600 23px 'Space Grotesk',Arial,sans-serif;color:#b3f267;margin-top:35px}
</style>
</head>
<body><div class="slide" id="slide"><div class="top"><div class="brand"><span class="mark">P·</span><span>PitchPulse <em>AI</em></span></div><small>HACKATHON DEMO / SYNTHETIC DATA</small></div><div class="orb" id="orb"></div><div class="dot" id="dot"></div><div class="content"><div class="kicker" id="kicker"></div><h1 id="title"></h1><p id="description"></p><div id="extra"></div></div><div class="footer"><span>EVERY MATCH TELLS A STORY</span><span id="number"></span></div></div>
<script>
const slides = [
  {k:'01 / THE MOMENT',t:'Football moves fast.<br><span class="accent">Meaning is easy to miss.</span>',d:'The story behind a play can disappear before the next one starts.'},
  {k:'02 / THE PROBLEM',t:'Seconds to explain<br><span class="accent">why it matters.</span>',d:'Analysts need context. Producers need a clear cue. Fans need an update they can follow.',extra:'<div class="chips"><span>ANALYST</span><span>PRODUCER</span><span>FAN</span></div>'},
  {k:'03 / LOCAL STUDIO DEMO',t:'A live view for <span class="accent">analysts.</span>',visual:'../studio-demo.png',light:false,d:'Actual local UI using generated match events.'},
  {k:'04 / TACTICAL SIGNALS',t:'From event to <span class="accent">insight.</span>',d:'Pass difficulty, defensive pressure, passing accuracy, and location-based xG.',extra:'<div class="chips"><span>PASS DIFFICULTY</span><span>TACTICAL PRESSURE</span><span>SHOT-LOCATION xG</span></div>'},
  {k:'05 / THE PIPELINE',t:'One moment.<br><span class="accent">Two audiences.</span>',d:'Validated events feed coordinated analysis and factual WebSocket delivery.',extra:'<div class="flow"><div class="node"><strong>Match events</strong><span>Generated and validated</span></div><div class="arrow">→</div><div class="node"><strong>Event Hubs</strong><span>Ordered match stream</span></div><div class="arrow">→</div><div class="node"><strong>Agent crew</strong><span>Tactics and stats</span></div><div class="arrow">→</div><div class="node"><strong>WebSockets</strong><span>Studio + fans</span></div></div>'},
  {k:'06 / LOCAL FAN DEMO',t:'The match, <span class="accent">your way.</span>',visual:'../fan-demo.png',light:true,d:'Actual local UI shown in Spanish.'},
  {k:'07 / OPTIONAL CLOUD AI',t:'Text and voice<br><span class="accent">when configured.</span>',d:'Microsoft Foundry can add personalized prose. Azure Speech can speak it. Factual updates arrive first.',extra:'<div class="chips"><span>5 LANGUAGES</span><span>3 TEXT STYLES</span><span>OPT-IN VOICE</span></div>'},
  {k:'08 / VERIFICATION',t:'Built to be <span class="accent">tested.</span>',d:'CI checks containers and Event Hubs integration. Local load tests measure factual fan-out; Azure staging measures both deployed streams.',extra:'<div class="metric">~12 ms<small>Local p95 · 200 play events · 10 studio + 50 fan subscribers · excludes cloud network</small></div>'},
  {k:'09 / THE NEXT STEP',t:'Every match<br><span class="accent">tells a story.</span>',d:'PitchPulse AI brings it to life. Next: a licensed feed and a broadcaster pilot.',extra:'<div class="url">github.com/Faruk-Icn/PitchPulse-AI</div>'}
];
const i=Math.max(0,Math.min(slides.length-1,Number(new URLSearchParams(location.search).get('slide')||1)-1));const s=slides[i];
document.querySelector('#kicker').textContent=s.k;document.querySelector('#title').innerHTML=s.t;
document.querySelector('#description').textContent=s.d||'';document.querySelector('#extra').innerHTML=s.extra||'';
document.querySelector('#number').textContent=String(i+1).padStart(2,'0')+' / 09';
if(s.light)document.querySelector('#slide').classList.add('light');
if(s.visual){document.querySelector('#slide').classList.add('visual');document.querySelector('#extra').innerHTML='<img class="shot" src="'+s.visual+'" alt="Local synthetic demo screenshot">';document.querySelector('#orb').hidden=true;document.querySelector('#dot').hidden=true;}
</script></body></html>
