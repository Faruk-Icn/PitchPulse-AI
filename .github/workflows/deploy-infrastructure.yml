name: Deploy Azure services

on:
  push:
    branches: [main]
    paths:
      - infrastructure/**
      - src/**
      - config/**
      - requirements*.txt
      - .github/workflows/deploy-infrastructure.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pitchpulse-infrastructure
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Azure configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          EVENT_HUB_NAMESPACE_NAME: ${{ vars.EVENT_HUB_NAMESPACE_NAME }}
          EVENT_HUB_NAME: ${{ vars.EVENT_HUB_NAME }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_LOCATION EVENT_HUB_NAMESPACE_NAME EVENT_HUB_NAME; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure $name before deploying infrastructure"
              missing=1
            fi
          done
          exit "$missing"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image and deploy services
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          EVENT_HUB_NAMESPACE_NAME: ${{ vars.EVENT_HUB_NAMESPACE_NAME }}
          EVENT_HUB_NAME: ${{ vars.EVENT_HUB_NAME }}
          INGESTION_PRINCIPAL_ID: ${{ vars.INGESTION_PRINCIPAL_ID }}
          ANALYTICS_PRINCIPAL_ID: ${{ vars.ANALYTICS_PRINCIPAL_ID }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_MODEL: ${{ vars.FOUNDRY_MODEL }}
        run: |
          set -euo pipefail
          if [[ -n "$FOUNDRY_PROJECT_ENDPOINT" && -z "$FOUNDRY_MODEL" ]] || [[ -z "$FOUNDRY_PROJECT_ENDPOINT" && -n "$FOUNDRY_MODEL" ]]; then
            echo '::error::Configure FOUNDRY_PROJECT_ENDPOINT and FOUNDRY_MODEL together'
            exit 1
          fi
          az bicep build --file infrastructure/main.bicep --stdout > /dev/null
          az bicep build --file infrastructure/apps.bicep --stdout > /dev/null
          if [[ "$(az group exists --name "$AZURE_RESOURCE_GROUP")" != "true" ]]; then
            echo "::error::Create resource group $AZURE_RESOURCE_GROUP in $AZURE_LOCATION before deploying"
            exit 1
          fi
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name pitchpulse-foundation \
            --template-file infrastructure/main.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              namespaceName="$EVENT_HUB_NAMESPACE_NAME" \
              eventHubName="$EVENT_HUB_NAME" \
              ingestionPrincipalId="$INGESTION_PRINCIPAL_ID" \
              analyticsPrincipalId="$ANALYTICS_PRINCIPAL_ID" \
            --output none
          outputs=$(az deployment group show --resource-group "$AZURE_RESOURCE_GROUP" --name pitchpulse-foundation --query properties.outputs --output json)
          registry_name=$(jq -r '.registryName.value' <<< "$outputs")
          registry_server=$(jq -r '.registryServer.value' <<< "$outputs")
          az acr build --registry "$registry_name" --image "pitchpulse-gateway:${GITHUB_SHA}" --file src/gateway/Dockerfile .
          app_outputs=$(az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name pitchpulse-services \
            --template-file infrastructure/apps.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              containerAppsEnvironmentId="$(jq -r '.containerAppsEnvironmentId.value' <<< "$outputs")" \
              registryServer="$registry_server" \
              gatewayIdentityId="$(jq -r '.gatewayIdentityId.value' <<< "$outputs")" \
              gatewayIdentityClientId="$(jq -r '.gatewayIdentityClientId.value' <<< "$outputs")" \
              keyVaultName="$(jq -r '.keyVaultName.value' <<< "$outputs")" \
              storageAccountUrl="$(jq -r '.storageAccountUrl.value' <<< "$outputs")" \
              speechRegion="$(jq -r '.speechRegion.value' <<< "$outputs")" \
              eventHubName="$EVENT_HUB_NAME" \
              imageTag="$GITHUB_SHA" \
              foundryProjectEndpoint="$FOUNDRY_PROJECT_ENDPOINT" \
              foundryModel="$FOUNDRY_MODEL" \
            --query properties.outputs --output json)
          broadcast_url=$(jq -r '.broadcastUrl.value' <<< "$app_outputs")
          fan_url=$(jq -r '.fanUrl.value' <<< "$app_outputs")
          echo "Broadcast studio: $broadcast_url"
          echo "Fan feed: $fan_url"
          connection=$(az eventhubs eventhub authorization-rule keys list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$EVENT_HUB_NAMESPACE_NAME" \
            --eventhub-name "$EVENT_HUB_NAME" \
            --name ingestion-send --query primaryConnectionString --output tsv)
          echo "::add-mask::$connection"
          export EVENT_HUB_SEND_CONNECTION_STRING="$connection"
          python -m pip install --quiet -r requirements-dev.txt
          python -m scripts.verify_staging \
            --broadcast-url "$broadcast_url" \
            --fan-url "$fan_url" \
            --eventhub-name "$EVENT_HUB_NAME" \
            --count 11 --max-p95-ms 1000
